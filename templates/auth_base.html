<!DOCTYPE html>
<html lang="en">
<head>

<title>{% block title %}SancharAI{% endblock %} — SancharAI</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="/static/app.css"/>
</head>
<body>
